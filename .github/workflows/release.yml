name: Release skill

on:
  push:
    tags:
      - "*-v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive skill name and version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SKILL="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if [ ! -d "$SKILL" ]; then
            echo "::error::No folder named '$SKILL' at repo root for tag '$TAG'"
            exit 1
          fi
          echo "skill=$SKILL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build ZIP
        run: |
          ZIP_NAME="${{ steps.tag.outputs.skill }}-v${{ steps.tag.outputs.version }}.zip"
          zip -r "$ZIP_NAME" "${{ steps.tag.outputs.skill }}"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.skill }} v${{ steps.tag.outputs.version }}
          files: ${{ env.zip_name }}
          generate_release_notes: false
